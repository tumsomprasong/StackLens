name: 🧩 Request New Technology Signature
description: Request detection for a new web framework, library, CDN, CMS, or security tool.
title: "[New Signature]: "
labels: ["rules", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Help expand the StackLens detection database! Please provide as much detail as possible about the technology.

  - type: input
    id: tech_name
    attributes:
      label: Technology Name
      placeholder: e.g., Fastify, Astro 5, Supabase Auth
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Official Website / Documentation URL
      placeholder: https://fastify.dev
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      placeholder: e.g., Web frameworks, Authentication, CDN, UI frameworks
    validations:
      required: true

  - type: textarea
    id: example_sites
    attributes:
      label: Example Public Websites using this Technology
      description: Provide 1-3 URLs where this technology is currently running live.
      placeholder: https://example.com
    validations:
      required: true

  - type: textarea
    id: detection_clues
    attributes:
      label: How can it be detected?
      description: Mention specific HTTP response headers, cookies, script tags, JS globals (`window.xxx`), DOM selectors, or meta tags.
      placeholder: |
        - Header: X-Powered-By: Fastify
        - Cookie: fastify.session
        - Script: /_fastify/...
        - Global: window.__FASTIFY__
    validations:
      required: false

